<?xml version="1.0" encoding="UTF-8"?>
<!--
  观象悟道 · 文字层模板
  占位符语法：{{var_name}}
  合成器读取此模板并替换所有 {{…}} 占位符后写出 text.svg。
  颜色与字号遵循 docs/art-style-guide.md §3。
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 800"
     width="600" height="800"
     font-family="serif"
     role="img">

  <title>临 文字层</title>

  <!-- 卦名与全名 -->
  <text x="300" y="60"
        font-size="32" fill="#273F52"
        text-anchor="middle" font-weight="bold">临</text>

  <text x="300" y="100"
        font-size="18" fill="#547A83"
        text-anchor="middle">地泽临</text>

  <!-- 分隔线 -->
  <line x1="40" y1="115" x2="560" y2="115"
        stroke="#273F52" stroke-width="0.8" opacity="0.4"/>

  <!-- 卦辞 -->
  <text x="40" y="150"
        font-size="13" fill="#547A83">卦辞</text>
  <text x="40" y="175"
        font-size="15" fill="#273F52">临：元亨利贞。至于八月有凶。</text>

  <!-- 彖传 -->
  <text x="40" y="215"
        font-size="13" fill="#547A83">彖传</text>
  <text x="40" y="240"
        font-size="15" fill="#273F52">临，刚浸而长，说而顺，刚中而应，大亨以正，天之道也。至于八月有凶，消不久也。</text>

  <!-- 大象 -->
  <text x="40" y="280"
        font-size="13" fill="#547A83">大象</text>
  <text x="40" y="305"
        font-size="15" fill="#273F52">泽上有地，临。君子以教思无穷，容保民无疆。</text>

  <!-- 分隔线 -->
  <line x1="40" y1="320" x2="560" y2="320"
        stroke="#273F52" stroke-width="0.8" opacity="0.4"/>

  <!-- 爻辞（六爻）-->
  <text x="40" y="345"
        font-size="13" fill="#547A83">爻辞</text>

  <text x="40"  y="370" font-size="13" fill="#B58C69">初爻</text>
  <text x="100" y="370" font-size="13" fill="#273F52">咸临，贞吉。</text>

  <text x="40"  y="395" font-size="13" fill="#B58C69">二爻</text>
  <text x="100" y="395" font-size="13" fill="#273F52">咸临，吉，无不利。</text>

  <text x="40"  y="420" font-size="13" fill="#B58C69">三爻</text>
  <text x="100" y="420" font-size="13" fill="#273F52">甘临，无攸利。既忧之，无咎。</text>

  <text x="40"  y="445" font-size="13" fill="#B58C69">四爻</text>
  <text x="100" y="445" font-size="13" fill="#273F52">至临，无咎。</text>

  <text x="40"  y="470" font-size="13" fill="#B58C69">五爻</text>
  <text x="100" y="470" font-size="13" fill="#273F52">知临，大君之宜，吉。</text>

  <text x="40"  y="495" font-size="13" fill="#B58C69">上爻</text>
  <text x="100" y="495" font-size="13" fill="#273F52">敦临，吉，无咎。</text>

  <!-- 小象（六爻）-->
  <text x="40" y="530"
        font-size="13" fill="#547A83">小象</text>

  <text x="40"  y="555" font-size="13" fill="#A2B4A1">初</text>
  <text x="100" y="555" font-size="13" fill="#273F52">“咸临贞吉”，志行正也。</text>

  <text x="40"  y="575" font-size="13" fill="#A2B4A1">二</text>
  <text x="100" y="575" font-size="13" fill="#273F52">“咸临吉无不利”，未顺命也。</text>

  <text x="40"  y="595" font-size="13" fill="#A2B4A1">三</text>
  <text x="100" y="595" font-size="13" fill="#273F52">“甘临”，位不当也。“既忧之”，咎不长也。</text>

  <text x="40"  y="615" font-size="13" fill="#A2B4A1">四</text>
  <text x="100" y="615" font-size="13" fill="#273F52">“至临无咎”，位当也。</text>

  <text x="40"  y="635" font-size="13" fill="#A2B4A1">五</text>
  <text x="100" y="635" font-size="13" fill="#273F52">“大君之宜”，行中之谓也。</text>

  <text x="40"  y="655" font-size="13" fill="#A2B4A1">上</text>
  <text x="100" y="655" font-size="13" fill="#273F52">“敦临之吉”，志在内也。</text>

  <!-- 底部印章占位 -->
  <rect x="480" y="720" width="80" height="60"
        fill="none" stroke="#A74439" stroke-width="1" rx="2"/>
  <text x="520" y="758"
        font-size="10" fill="#A74439"
        text-anchor="middle">印章</text>

</svg>
