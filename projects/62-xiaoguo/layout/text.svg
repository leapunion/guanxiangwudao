<?xml version="1.0" encoding="UTF-8"?>
<!--
  观象悟道 · 文字层模板
  占位符语法：{{var_name}}
  合成器读取此模板并替换所有 {{…}} 占位符后写出 text.svg。
  颜色与字号遵循 docs/art-style-guide.md §3。
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 800"
     width="600" height="800"
     font-family="serif"
     role="img">

  <title>小过 文字层</title>

  <!-- 卦名与全名 -->
  <text x="300" y="60"
        font-size="32" fill="#273F52"
        text-anchor="middle" font-weight="bold">小过</text>

  <text x="300" y="100"
        font-size="18" fill="#547A83"
        text-anchor="middle">雷山小过</text>

  <!-- 分隔线 -->
  <line x1="40" y1="115" x2="560" y2="115"
        stroke="#273F52" stroke-width="0.8" opacity="0.4"/>

  <!-- 卦辞 -->
  <text x="40" y="150"
        font-size="13" fill="#547A83">卦辞</text>
  <text x="40" y="175"
        font-size="15" fill="#273F52">小过：亨，利贞。可小事，不可大事。飞鸟遗之音，不宜上，宜下，大吉。</text>

  <!-- 彖传 -->
  <text x="40" y="215"
        font-size="13" fill="#547A83">彖传</text>
  <text x="40" y="240"
        font-size="15" fill="#273F52">小过，小者过而亨也。过以利贞，与时行也。柔得中，是以小事吉也。刚失位而不中，是以不可大事也。有飞鸟之象焉。飞鸟遗之音，不宜上，宜下，大吉，上逆而下顺也。</text>

  <!-- 大象 -->
  <text x="40" y="280"
        font-size="13" fill="#547A83">大象</text>
  <text x="40" y="305"
        font-size="15" fill="#273F52">山上有雷，小过。君子以行过乎恭，丧过乎哀，用过乎俭。</text>

  <!-- 分隔线 -->
  <line x1="40" y1="320" x2="560" y2="320"
        stroke="#273F52" stroke-width="0.8" opacity="0.4"/>

  <!-- 爻辞（六爻）-->
  <text x="40" y="345"
        font-size="13" fill="#547A83">爻辞</text>

  <text x="40"  y="370" font-size="13" fill="#B58C69">初爻</text>
  <text x="100" y="370" font-size="13" fill="#273F52">飞鸟以凶。</text>

  <text x="40"  y="395" font-size="13" fill="#B58C69">二爻</text>
  <text x="100" y="395" font-size="13" fill="#273F52">过其祖，遇其妣；不及其君，遇其臣，无咎。</text>

  <text x="40"  y="420" font-size="13" fill="#B58C69">三爻</text>
  <text x="100" y="420" font-size="13" fill="#273F52">弗过防之，从或戕之，凶。</text>

  <text x="40"  y="445" font-size="13" fill="#B58C69">四爻</text>
  <text x="100" y="445" font-size="13" fill="#273F52">无咎，弗过遇之。往厉必戒，勿用永贞。</text>

  <text x="40"  y="470" font-size="13" fill="#B58C69">五爻</text>
  <text x="100" y="470" font-size="13" fill="#273F52">密云不雨，自我西郊，公弋取彼在穴。</text>

  <text x="40"  y="495" font-size="13" fill="#B58C69">上爻</text>
  <text x="100" y="495" font-size="13" fill="#273F52">弗遇过之，飞鸟离之，凶，是谓灾眚。</text>

  <!-- 小象（六爻）-->
  <text x="40" y="530"
        font-size="13" fill="#547A83">小象</text>

  <text x="40"  y="555" font-size="13" fill="#A2B4A1">初</text>
  <text x="100" y="555" font-size="13" fill="#273F52">“飞鸟以凶”，不可如何也。</text>

  <text x="40"  y="575" font-size="13" fill="#A2B4A1">二</text>
  <text x="100" y="575" font-size="13" fill="#273F52">“不及其君”，臣不可过也。</text>

  <text x="40"  y="595" font-size="13" fill="#A2B4A1">三</text>
  <text x="100" y="595" font-size="13" fill="#273F52">“从或戕之”，凶如何也。</text>

  <text x="40"  y="615" font-size="13" fill="#A2B4A1">四</text>
  <text x="100" y="615" font-size="13" fill="#273F52">“弗过遇之”，位不当也；“往厉必戒”，终不可长也。</text>

  <text x="40"  y="635" font-size="13" fill="#A2B4A1">五</text>
  <text x="100" y="635" font-size="13" fill="#273F52">“密云不雨”，已上也。</text>

  <text x="40"  y="655" font-size="13" fill="#A2B4A1">上</text>
  <text x="100" y="655" font-size="13" fill="#273F52">“弗遇过之”，已亢也。</text>

  <!-- 底部印章占位 -->
  <rect x="480" y="720" width="80" height="60"
        fill="none" stroke="#A74439" stroke-width="1" rx="2"/>
  <text x="520" y="758"
        font-size="10" fill="#A74439"
        text-anchor="middle">印章</text>

</svg>
