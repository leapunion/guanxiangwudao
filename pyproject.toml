[project]
name = "gxwd"
version = "0.1.0"
description = "观象悟道 — 易经六十四卦国学与国画 Agentic Studio"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gxwd = "gxwd.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
