name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -q

      - name: Run `gxwd validate binary --all`
        run: gxwd validate binary --all

      - name: Run `gxwd status --json`
        run: gxwd status --json

  build:
    name: build wheel + install smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build toolchain
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Prepack bundled data
        run: ./scripts/prepack.sh

      - name: Build wheel + sdist
        run: python -m build

      - name: Verify dist contents
        run: |
          ls -lh dist/
          python -c "
          import zipfile, sys
          for whl in __import__('pathlib').Path('dist').glob('*.whl'):
              with zipfile.ZipFile(whl) as z:
                  names = z.namelist()
                  bundled = [n for n in names if '_bundled/data/' in n]
                  assert any('hexagrams.json' in n for n in bundled), 'wheel 缺少 bundled hexagrams.json'
                  assert any('canonical-texts.json' in n for n in bundled), 'wheel 缺少 bundled canonical-texts.json'
                  svgs = [n for n in names if '_bundled/assets/hexagram-svg/' in n and n.endswith('.svg')]
                  assert len(svgs) == 64, f'wheel 缺少 64 卦符 SVG，实际 {len(svgs)}'
                  print(f'wheel OK: {whl.name} 含 bundled data + {len(svgs)} SVG')
          "

      - name: Install smoke (clean venv)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/gxwd-*.whl
          /tmp/smoke/bin/gxwd validate binary --all
          /tmp/smoke/bin/gxwd hexagram show 37 | head -3
          /tmp/smoke/bin/gxwd web build --out /tmp/smoke-web.html
          ls -lh /tmp/smoke-web.html

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gxwd-dist-${{ github.sha }}
          path: dist/
          retention-days: 30
