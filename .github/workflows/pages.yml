name: Deploy GH Pages

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "assets/**"
      - "projects/**"
      - "docs/art-style-guide.md"
      - "src/gxwd/web.py"
      - "src/gxwd/composer.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Build viewer
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p _site
          gxwd web build --out _site/index.html
          ls -lh _site/

      - name: Generate PEP 503 simple index (PyPI 替代入口)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p _site/simple/gxwd
          python - <<'PY' > _site/simple/gxwd/index.html
          import json, os, subprocess, html
          repo = os.environ["REPO"]
          result = subprocess.run(
              ["gh", "release", "list", "--repo", repo, "--limit", "50", "--json", "tagName"],
              capture_output=True, text=True, check=True,
          )
          tags = [r["tagName"] for r in json.loads(result.stdout)]
          links = []
          for tag in tags:
              r = subprocess.run(
                  ["gh", "release", "view", tag, "--repo", repo, "--json", "assets"],
                  capture_output=True, text=True,
              )
              if r.returncode != 0:
                  continue
              for a in json.loads(r.stdout).get("assets", []):
                  name = a["name"]
                  if name.endswith(".whl") or name.endswith(".tar.gz"):
                      url = f"https://github.com/{repo}/releases/download/{tag}/{name}"
                      links.append((name, url))
          print('<!DOCTYPE html>')
          print('<html><head><meta name="pypi:repository-version" content="1.0"><title>Links for gxwd</title></head>')
          print('<body><h1>Links for gxwd</h1>')
          for name, url in links:
              print(f'<a href="{html.escape(url)}">{html.escape(name)}</a><br/>')
          print('</body></html>')
          PY
          # 顶层 /simple/ 也给一个列出所有 project（本项目只有 gxwd）
          cat > _site/simple/index.html <<'HTML'
          <!DOCTYPE html>
          <html><head><meta name="pypi:repository-version" content="1.0"><title>Simple index</title></head>
          <body><a href="gxwd/">gxwd</a><br/></body></html>
          HTML
          echo "Generated PEP 503 index:"
          ls -R _site/simple/
          echo "---"
          cat _site/simple/gxwd/index.html

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
